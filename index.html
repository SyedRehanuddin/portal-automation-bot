      function useReveal() {
        useEffect(() => {
          const nodes = document.querySelectorAll(".reveal");
          const observer = new IntersectionObserver(
            entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
          );
          nodes.forEach(node => observer.observe(node));
          return () => observer.disconnect();
        }, []);
      }

      function useCountUp(target, start) {
        const [value, setValue] = useState(0);

        useEffect(() => {
          if (!start) return;
          const duration = 1500;
          const started = performance.now();
          let frameId;

          const tick = now => {
            const progress = Math.min((now - started) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            setValue(Math.floor(eased * target));
            if (progress < 1) frameId = requestAnimationFrame(tick);
          };

          frameId = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(frameId);
        }, [target, start]);

        return value;
      }

      function StatNumber({ value, suffix, start }) {
        const count = useCountUp(value, start);
        return (
          <span className="display-font text-4xl font-bold text-gold md:text-5xl">
            {count.toLocaleString("en-IN")}
            {suffix}
          </span>
        );
      }

      function Modal({ modal, onClose }) {
        useEffect(() => {
          if (!modal) return;
          const onKeyDown = event => {
            if (event.key === "Escape") onClose();
          };
          document.body.style.overflow = "hidden";
          window.addEventListener("keydown", onKeyDown);
          return () => {
            document.body.style.overflow = "";
            window.removeEventListener("keydown", onKeyDown);
          };
        }, [modal, onClose]);

        if (!modal) return null;

        return (
          <div className="fixed inset-0 z-[80] flex items-center justify-center bg-navy/80 px-4 py-8 backdrop-blur-sm" onClick={onClose}>

                      <h3 className="font-sans text-lg font-extrabold text-navy">Our Vision</h3>
                      <p className="mt-2">To impart integrated and comprehensive education that is formative and not merely informative, developing the full character and personality of every student toward self-fulfillment and service to society.</p>
                    </section>
                    <section>
                      <h3 className="font-sans text-lg font-extrabold text-navy">Our Mission</h3>
                      <p className="mt-2">To place students in an environment that develops reverence, tolerance and understanding across all cultures and beliefs. To enable students to imbibe the four pillars of Culture, Compassion, Character and Courage, and to provide value-based education that prepares them for both academic excellence and a life of integrity.</p>
                    </section>
                    <section>
                      <h3 className="font-sans text-lg font-extrabold text-navy">Why Choose Tejaswi</h3>
                      <p className="mt-2">Tejaswi believes that life must have a spiritual orientation alongside academic rigor. We empower students to be free, morally responsible and integrated individuals. Our non-communal, non-sectarian approach places emphasis on the permanent values of life as understood by both ancient and modern thinkers.</p>
                    </section>
                  </div>
                </div>
              ) : (
                <div>

      function StatsBar() {
        const ref = useRef(null);
        const [start, setStart] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setStart(true);
                observer.disconnect();
              }
            },
            { threshold: 0.35 }
          );
          if (ref.current) observer.observe(ref.current);
          return () => observer.disconnect();
        }, []);

        const stats = [

          { value: 9658, suffix: "+", label: "Students Shaped" },
