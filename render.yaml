services:
  - type: web
    name: portal-automation-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CONFIG_PATH
        value: config.json
      - key: SELENIUM_HEADLESS
        value: "true"
      - key: SELENIUM_CLOUD
        value: "true"
      - key: TZ
        value: Asia/Kolkata
      - key: TIMETABLE_DISABLE_CACHE
        value: "false"
      - key: TELEGRAM_DROP_PENDING_UPDATES
        value: "true"
      - key: ENABLE_TIMETABLE_SCHEDULER
        value: "true"
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: ENROLLMENT_NUMBER
        sync: false
      - key: PORTAL_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PORTAL_COOKIES_JSON
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_TABLE
        value: bot_state
